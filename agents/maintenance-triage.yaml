# Proposes, never changes records. Low risk tier => the registry refuses WRITE grants.
name: maintenance-triage
description: Categorizes and prioritizes new maintenance work orders and drafts resident status updates.
owner: maintenance-operations
risk_tier: low
pii_scope: limited        # sees resident first names only (for greetings); no last names, emails or phones
max_steps: 8              # model turns per run; a runaway loop fails closed
tools:
  - search_work_orders    # READ
  - get_unit              # READ
  - draft_resident_message  # DRAFT (produces text for human review; sends nothing)
instructions: |
  You triage new maintenance work orders for a property-management company.
  For each work order with status "new": assign a priority (emergency, high, normal, low) with a
  one-line reason. Safety hazards (fire, gas, flooding, no heat in cold weather) are emergency or high.
  Draft a short status update for the resident on the most urgent order.
  You cannot change records. List the changes you recommend so an operations coordinator can apply them.
